<title>AsiaCandy Kovilpatti</title>
<style>
:root{--wa-dark:#075E54;--wa-teal:#128C7E;--wa-green:#25D366;--wa-light-green:#DCF8C6;--wa-bg:#ECE5DD;--wa-panel:#FFFFFF;--wa-text:#0B141A;--wa-subtext:#54656F;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;background-color:#ECE5DD;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160' fill='none' stroke='%23b9ad98' stroke-opacity='.45' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='24' cy='26' r='9'/><path d='M62 18l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z'/><path d='M120 30c-8-10-22 2-10 14l10 10 10-10c12-12-2-24-10-14z'/><rect x='18' y='84' width='26' height='18' rx='9'/><path d='M18 93h-8M44 93h8'/><path d='M80 84a12 12 0 1 0 0 .1M74 92q6 6 12 0'/><path d='M124 88l14 14M138 88l-14 14'/><circle cx='40' cy='138' r='5'/><path d='M92 134h30M92 142h20'/><path d='M140 130q8 8 0 16'/></svg>");background-size:160px 160px;color:var(--wa-text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:460px;background:var(--wa-panel);border-radius:18px;box-shadow:0 20px 50px rgba(7,94,84,.18);overflow:hidden;}
.topbar{background:linear-gradient(135deg,var(--wa-dark),var(--wa-teal));padding:34px 20px 52px;text-align:center;position:relative;}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:24px;background:var(--wa-panel);border-radius:50% 50% 0 0/100% 100% 0 0;}
.topbar img{display:block;margin:0 auto;width:260px;max-width:80%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));}
.content{padding:8px 28px 32px;text-align:center;}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--wa-light-green);color:var(--wa-dark);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;margin-top:-18px;margin-bottom:18px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wa-green);box-shadow:0 0 0 3px rgba(37,211,102,.25);}
h1{font-size:24px;line-height:1.3;margin-bottom:10px;}
p.sub{font-size:15px;color:var(--wa-subtext);line-height:1.5;margin-bottom:26px;}
.bubble{background:var(--wa-light-green);border-radius:14px 14px 14px 2px;padding:14px 18px;text-align:left;font-size:14.5px;margin-bottom:26px;}
.bubble .time{display:block;text-align:right;font-size:11px;color:var(--wa-subtext);margin-top:6px;}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa-green);color:#fff;text-decoration:none;font-size:17px;font-weight:700;padding:16px 20px;border-radius:50px;box-shadow:0 10px 24px rgba(37,211,102,.4);transition:transform .15s ease,box-shadow .15s ease;}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(37,211,102,.5);}
.cta svg{width:22px;height:22px;flex-shrink:0;}
.footer-note{margin-top:18px;font-size:12.5px;color:var(--wa-subtext);}
</style>
